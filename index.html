<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencje</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        #pageContent,
        #normalLicenseScreen {
            display: none;
        }

        .start-screen,
        .login-screen,
        .normal-license-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #111 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-screen,
        .normal-license-screen {
            display: none;
        }

        .box {
            width: 390px;
            padding: 35px;
            background: rgba(0, 255, 204, 0.08);
            border: 2px solid #00ffcc;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            text-align: center;
        }

        .box h2 {
            margin-top: 0;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            font-size: 34px;
        }

        .box p {
            color: #aaa;
            margin-bottom: 25px;
        }

        .box input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 15px;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            background: #0b0b0b;
            color: white;
            font-size: 18px;
            outline: none;
        }

        .box button {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .box button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #00ffcc;
        }

        .normal-btn {
            background: transparent !important;
            color: #00ffcc !important;
            border: 2px solid #00ffcc !important;
        }

        .message {
            min-height: 24px;
            margin-top: 15px;
            font-weight: bold;
        }

        .error {
            color: #ff4d4d;
        }

        .success {
            color: #00ff88;
        }

        .role-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 204, 0.12);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 10px 18px;
            color: #00ffcc;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            position: absolute;
            font-size: 64px;
            letter-spacing: 2px;
            z-index: 5;
            text-shadow: 0 0 20px #00ffcc;
        }

        .orbit {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            animation: rotateOrbit 18s linear infinite;
        }

        .item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .item span {
            display: inline-block;
            padding: 10px 18px;
            background: rgba(0, 255, 204, 0.12);
            border: 2px solid #00ffcc;
            border-radius: 20px;
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            animation: keepReadable 18s linear infinite;
        }

        .item1 {
            transform: rotate(0deg) translateX(270px);
        }

        .item1 span {
            transform: translate(-50%, -50%) rotate(0deg);
        }

        .item2 {
            transform: rotate(120deg) translateX(270px);
        }

        .item2 span {
            transform: translate(-50%, -50%) rotate(-120deg);
        }

        .item3 {
            transform: rotate(240deg) translateX(270px);
        }

        .item3 span {
            transform: translate(-50%, -50%) rotate(-240deg);
        }

        @keyframes rotateOrbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes keepReadable {
            from {
                rotate: 0deg;
            }

            to {
                rotate: -360deg;
            }
        }

        .json-section {
            min-height: 100vh;
            padding: 80px 20px;
            background: #0b0b0b;
            text-align: center;
        }

        .json-section h2 {
            font-size: 42px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            margin-bottom: 40px;
        }

        .json-list {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .json-file {
            padding: 18px 25px;
            background: rgba(0, 255, 204, 0.08);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .json-file:hover {
            background: rgba(0, 255, 204, 0.2);
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
        }

        .info {
            color: #aaa;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="start-screen" id="startScreen">
        <div class="box">
            <h2>Kim jesteś?</h2>
            <p>Wybierz sposób wejścia.</p>

            <button onclick="chooseAdmin()">Jestem adminem</button>
            <button class="normal-btn" onclick="chooseNormal()">Jestem normalną osobą</button>
        </div>
    </div>

    <div class="login-screen" id="loginScreen">
        <div class="box">
            <h2>Panel Admina</h2>

            <input type="password" id="passwordInput" placeholder="Wpisz hasło admina">

            <button onclick="checkPassword()">Wejdź jako admin</button>
            <button class="normal-btn" onclick="backToStart()">Wróć</button>

            <div class="message error" id="loginError"></div>
        </div>
    </div>

    <div class="normal-license-screen" id="normalLicenseScreen">
        <div class="box">
            <h2>Sprawdź licencję</h2>
            <p>Wpisz swoją licencję.</p>

            <input type="text" id="licenseInput" placeholder="Wpisz licencję">

            <button onclick="checkLicense()">Sprawdź licencję</button>
            <button class="normal-btn" onclick="backToStartFromNormal()">Wróć</button>

            <div class="message" id="licenseResult"></div>
        </div>
    </div>

    <main id="pageContent">
        <div class="role-info">Tryb: admin</div>

        <section class="hero">
            <div class="container">
                <h1>Licencje</h1>

                <div class="orbit">
                    <div class="item item1">
                        <span>CodeBot</span>
                    </div>

                    <div class="item item2">
                        <span>PluginMinecraft</span>
                    </div>

                    <div class="item item3">
                        <span>AllLicencseInOne</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="json-section">
            <h2>Lista JSON</h2>
            <p class="info">Kliknij plik JSON, aby go otworzyć.</p>

            <div class="json-list" id="jsonList">
                Ładowanie listy...
            </div>
        </section>
    </main>

    <script>
        const startScreen = document.getElementById("startScreen");
        const loginScreen = document.getElementById("loginScreen");
        const normalLicenseScreen = document.getElementById("normalLicenseScreen");
        const pageContent = document.getElementById("pageContent");

        const passwordInput = document.getElementById("passwordInput");
        const loginError = document.getElementById("loginError");

        const licenseInput = document.getElementById("licenseInput");
        const licenseResult = document.getElementById("licenseResult");

        const jsonList = document.getElementById("jsonList");

        const ADMIN_PASSWORD_HASH = "ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270";

        let jsonLoaded = false;

        function chooseAdmin() {
            startScreen.style.display = "none";
            loginScreen.style.display = "flex";
            normalLicenseScreen.style.display = "none";
            pageContent.style.display = "none";
            passwordInput.focus();
        }

        function chooseNormal() {
            startScreen.style.display = "none";
            loginScreen.style.display = "none";
            normalLicenseScreen.style.display = "flex";
            pageContent.style.display = "none";
            licenseInput.focus();
        }

        function backToStart() {
            loginScreen.style.display = "none";
            normalLicenseScreen.style.display = "none";
            pageContent.style.display = "none";
            startScreen.style.display = "flex";

            loginError.textContent = "";
            passwordInput.value = "";
        }

        function backToStartFromNormal() {
            loginScreen.style.display = "none";
            normalLicenseScreen.style.display = "none";
            pageContent.style.display = "none";
            startScreen.style.display = "flex";

            licenseResult.textContent = "";
            licenseResult.className = "message";
            licenseInput.value = "";
        }

        async function sha256(text) {
            const encodedText = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest("SHA-256", encodedText);
            const hashArray = Array.from(new Uint8Array(hashBuffer));

            return hashArray
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function checkPassword() {
            if (!crypto.subtle) {
                loginError.textContent = "Uruchom stronę przez serwer, np. python -m http.server 8000";
                return;
            }

            const typedPassword = passwordInput.value;
            const typedPasswordHash = await sha256(typedPassword);

            if (typedPasswordHash === ADMIN_PASSWORD_HASH) {
                sessionStorage.setItem("role", "admin");
                showAdminPage();
            } else {
                loginError.textContent = "Błędne hasło!";
                passwordInput.value = "";
            }
        }

        function showAdminPage() {
            startScreen.style.display = "none";
            loginScreen.style.display = "none";
            normalLicenseScreen.style.display = "none";
            pageContent.style.display = "block";

            loadJsonList();
        }

        function loadJsonList() {
            if (jsonLoaded) return;
            jsonLoaded = true;

            fetch("lista.json")
                .then(response => response.json())
                .then(files => {
                    jsonList.innerHTML = "";

                    files.forEach(file => {
                        const div = document.createElement("div");
                        div.className = "json-file";
                        div.textContent = file;

                        div.onclick = () => {
                            window.location.href = file;
                        };

                        jsonList.appendChild(div);
                    });
                })
                .catch(error => {
                    jsonList.innerHTML = "Nie udało się załadować lista.json";
                    console.error(error);
                });
        }

        function checkLicense() {
            const typedLicense = licenseInput.value.trim();

            licenseResult.textContent = "";
            licenseResult.className = "message";

            if (typedLicense.length === 0) {
                licenseResult.textContent = "Wpisz licencję.";
                licenseResult.classList.add("error");
                return;
            }

            fetch("plg.json")
                .then(response => response.text())
                .then(text => {
                    const licenses = [];
                    const matches = text.match(/"([^"]+)"/g);

                    if (!matches) {
                        licenseResult.textContent = "Błąd: nie znaleziono żadnych licencji w plg.json.";
                        licenseResult.classList.add("error");
                        return;
                    }

                    matches.forEach(item => {
                        licenses.push(item.replaceAll('"', ""));
                    });

                    if (licenses.includes(typedLicense)) {
                        licenseResult.textContent = "Licencja jest poprawna.";
                        licenseResult.classList.add("success");
                    } else {
                        licenseResult.textContent = "Licencja nie istnieje.";
                        licenseResult.classList.add("error");
                    }
                })
                .catch(error => {
                    licenseResult.textContent = "Nie udało się odczytać pliku plg.json.";
                    licenseResult.classList.add("error");
                    console.error(error);
                });
        }

        passwordInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

        licenseInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkLicense();
            }
        });

        const savedRole = sessionStorage.getItem("role");

        if (savedRole === "admin") {
            showAdminPage();
        }
    </script>

</body>
</html>
