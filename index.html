<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencje</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 64px;
            letter-spacing: 2px;
            z-index: 2;
            text-shadow: 0 0 20px #00ffcc;
        }

        .circle-text {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate 10s linear infinite;
        }

        .circle-text span {
            position: absolute;
            left: 50%;
            top: 50%;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            transform-origin: 0 0;
        }

        .text1 {
            transform: rotate(0deg) translate(180px) rotate(0deg);
        }

        .text2 {
            transform: rotate(90deg) translate(180px) rotate(-90deg);
        }

        .text3 {
            transform: rotate(180deg) translate(180px) rotate(-180deg);
        }

        .text4 {
            transform: rotate(270deg) translate(180px) rotate(-270deg);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Licencje</h1>

        <div class="circle-text">
            <span class="text1">CodeBot</span>
            <span class="text2">PluginMinecraft</span>
            <span class="text3">AllLicencseInOne</span>
            <span class="text4">CodeBot</span>
        </div>
    </div>

</body>
</html>
