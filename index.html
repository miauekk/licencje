<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencje</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            position: absolute;
            font-size: 64px;
            letter-spacing: 2px;
            z-index: 5;
            text-shadow: 0 0 20px #00ffcc;
        }

        .orbit {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            animation: rotateOrbit 18s linear infinite;
        }

        .item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .item span {
            display: inline-block;
            padding: 10px 18px;
            background: rgba(0, 255, 204, 0.12);
            border: 2px solid #00ffcc;
            border-radius: 20px;
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            animation: keepReadable 18s linear infinite;
        }

        .item1 {
            transform: rotate(0deg) translateX(270px);
        }

        .item1 span {
            transform: translate(-50%, -50%) rotate(0deg);
        }

        .item2 {
            transform: rotate(120deg) translateX(270px);
        }

        .item2 span {
            transform: translate(-50%, -50%) rotate(-120deg);
        }

        .item3 {
            transform: rotate(240deg) translateX(270px);
        }

        .item3 span {
            transform: translate(-50%, -50%) rotate(-240deg);
        }

        @keyframes rotateOrbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes keepReadable {
            from {
                rotate: 0deg;
            }

            to {
                rotate: -360deg;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Licencje</h1>

        <div class="orbit">
            <div class="item item1">
                <span>CodeBot</span>
            </div>

            <div class="item item2">
                <span>PluginMinecraft</span>
            </div>

            <div class="item item3">
                <span>AllLicencseInOne</span>
            </div>
        </div>
    </div>

</body>
</html>
