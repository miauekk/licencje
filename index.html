<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencje</title>

    <style>
        body {
            margin: 0;
            min-height: 200vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            position: absolute;
            font-size: 64px;
            letter-spacing: 2px;
            z-index: 5;
            text-shadow: 0 0 20px #00ffcc;
        }

        .orbit {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            animation: rotateOrbit 18s linear infinite;
        }

        .item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .item span {
            display: inline-block;
            padding: 10px 18px;
            background: rgba(0, 255, 204, 0.12);
            border: 2px solid #00ffcc;
            border-radius: 20px;
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            animation: keepReadable 18s linear infinite;
        }

        .item1 {
            transform: rotate(0deg) translateX(270px);
        }

        .item1 span {
            transform: translate(-50%, -50%) rotate(0deg);
        }

        .item2 {
            transform: rotate(120deg) translateX(270px);
        }

        .item2 span {
            transform: translate(-50%, -50%) rotate(-120deg);
        }

        .item3 {
            transform: rotate(240deg) translateX(270px);
        }

        .item3 span {
            transform: translate(-50%, -50%) rotate(-240deg);
        }

        @keyframes rotateOrbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes keepReadable {
            from {
                rotate: 0deg;
            }

            to {
                rotate: -360deg;
            }
        }

        .json-section {
            min-height: 100vh;
            padding: 80px 20px;
            background: #0b0b0b;
            text-align: center;
        }

        .json-section h2 {
            font-size: 42px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            margin-bottom: 40px;
        }

        .json-list {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .json-file {
            padding: 18px 25px;
            background: rgba(0, 255, 204, 0.08);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .json-file:hover {
            background: rgba(0, 255, 204, 0.2);
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
        }

        .info {
            color: #aaa;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container">
            <h1>Licencje</h1>

            <div class="orbit">
                <div class="item item1">
                    <span>CodeBot</span>
                </div>

                <div class="item item2">
                    <span>PluginMinecraft</span>
                </div>

                <div class="item item3">
                    <span>AllLicencseInOne</span>
                </div>
            </div>
        </div>
    </section>

    <section class="json-section">
        <h2>Lista JSON</h2>
        <p class="info">Kliknij plik JSON, aby go otworzyć.</p>

        <div class="json-list" id="jsonList">
            Ładowanie listy...
        </div>
    </section>

    <script>
        const jsonList = document.getElementById("jsonList");

        fetch("lista.json")
            .then(response => response.json())
            .then(files => {
                jsonList.innerHTML = "";

                files.forEach(file => {
                    const div = document.createElement("div");
                    div.className = "json-file";
                    div.textContent = file;

                    div.onclick = () => {
                        window.location.href = file;
                    };

                    jsonList.appendChild(div);
                });
            })
            .catch(error => {
                jsonList.innerHTML = "Nie udało się załadować lista.json";
                console.error(error);
            });
    </script>

</body>
</html>
